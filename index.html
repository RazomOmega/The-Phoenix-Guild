<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Guildhall Ledger</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --ink:#221a10;
    --ink-2:#2b2114;
    --parchment:#efe4c6;
    --parchment-edge:#e2d3aa;
    --brass:#b0812e;
    --brass-deep:#8a651f;
    --verdigris:#5d7c6c;
    --rust:#8a4b34;
    --text:#3a2e1c;
    --text-muted:#7a6b4d;
    --text-on-ink:#e9dfc4;
    --text-on-ink-muted:#b6a985;
    --radius:6px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition-duration:0.001ms !important; animation-duration:0.001ms !important; }
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--ink);
    color:var(--text-on-ink);
    font-family:'Inter', -apple-system, sans-serif;
    line-height:1.5;
    min-height:100vh;
  }
  h1,h2{ font-family:'IM Fell English', Georgia, serif; font-weight:400; margin:0; }

  /* ---------- shell ---------- */
  .app{
    display:flex; align-items:flex-start; gap:34px;
    max-width:1180px; margin:0 auto; padding:0 24px 72px;
  }

  /* ---------- left navigation ---------- */
  .sidebar{
    position:sticky; top:0; z-index:10;
    flex:0 0 246px; width:246px; height:100vh;
    display:flex; flex-direction:column;
    padding:34px 0 22px;
  }
  .sidebar h1{ font-size:1.45rem; line-height:1.2; }
  .sidebar .tagline{
    margin:8px 0 0; font-size:0.83rem; color:var(--text-on-ink-muted); max-width:30ch;
  }
  .sync{ font-size:0.78rem; color:var(--text-on-ink-muted); display:flex; align-items:center; gap:6px; margin-top:14px; }
  .sync-dot{ width:7px; height:7px; border-radius:50%; background:var(--verdigris); flex-shrink:0; }
  .sync.error .sync-dot{ background:#a15c3f; }

  .side-scroll{ flex:1; overflow-y:auto; margin-top:20px; padding-right:4px; }
  .side-scroll::-webkit-scrollbar{ width:6px; }
  .side-scroll::-webkit-scrollbar-thumb{ background:rgba(233,223,196,0.15); border-radius:3px; }

  nav.side{ display:flex; flex-direction:column; gap:1px; }
  .nav-item{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    width:100%; background:none; border:none; border-left:2px solid transparent;
    color:var(--text-on-ink-muted); font:inherit; font-size:0.9rem;
    padding:8px 10px; border-radius:0 5px 5px 0; cursor:pointer; text-align:left;
  }
  .nav-item:hover{ color:var(--text-on-ink); background:rgba(233,223,196,0.06); }
  .nav-item.active{ color:var(--brass); border-left-color:var(--brass); background:rgba(176,129,46,0.12); }
  .nav-count{ font-size:0.75rem; font-variant-numeric:tabular-nums; opacity:0.75; flex-shrink:0; }

  .side-foot{ margin-top:16px; padding-top:14px; border-top:1px solid rgba(233,223,196,0.15); display:flex; flex-direction:column; gap:10px; align-items:flex-start; }
  .stat{ font-size:0.8rem; color:var(--text-on-ink-muted); }

  .toggle{ display:flex; align-items:center; gap:8px; font-size:0.82rem; color:var(--text-on-ink-muted); cursor:pointer; }
  .toggle input{ position:absolute; opacity:0; width:0; height:0; }
  .track{
    width:30px; height:17px; border-radius:999px; flex-shrink:0;
    border:1px solid rgba(233,223,196,0.35); background:rgba(0,0,0,0.25);
    position:relative; transition:background .2s ease, border-color .2s ease;
  }
  .knob{
    position:absolute; top:2px; left:2px; width:11px; height:11px; border-radius:50%;
    background:var(--text-on-ink-muted); transition:transform .2s ease, background .2s ease;
  }
  .toggle input:checked + .track{ background:rgba(176,129,46,0.35); border-color:var(--brass); }
  .toggle input:checked + .track .knob{ transform:translateX(13px); background:var(--brass); }
  .toggle input:focus-visible + .track{ outline:2px solid var(--verdigris); outline-offset:2px; }

  /* ---------- DM mode ---------- */
  .dm-row{
    width:100%; margin-top:4px; padding-top:12px;
    border-top:1px solid rgba(233,223,196,0.15);
    display:flex; flex-direction:column; gap:6px; align-items:flex-start;
  }
  .toggle.dm input:checked + .track{ background:rgba(93,124,108,0.45); border-color:var(--verdigris); }
  .toggle.dm input:checked + .track .knob{ background:var(--verdigris); }
  body.dm .toggle.dm{ color:var(--text-on-ink); }
  .dm-badge{
    font-size:0.74rem; letter-spacing:0.06em; text-transform:uppercase;
    color:var(--verdigris); border:1px solid rgba(93,124,108,0.5);
    border-radius:999px; padding:3px 9px;
  }
  .dm-badge[hidden]{ display:none; }
  body.dm .ledger{ box-shadow:0 0 0 2px var(--verdigris), 0 12px 30px rgba(0,0,0,0.35); }

  .sheet input.code{
    font-size:26px; letter-spacing:0.45em; text-indent:0.45em;
    text-align:center; font-variant-numeric:tabular-nums;
  }
  .sheet.shake{ animation:shake .3s ease; }
  @keyframes shake{
    0%,100%{ transform:translateX(0); } 20%{ transform:translateX(-7px); }
    40%{ transform:translateX(7px); } 60%{ transform:translateX(-4px); } 80%{ transform:translateX(4px); }
  }
  .sheet .code{ margin-top:16px; }
  .sr-only{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;
  }

  .link-btn{
    background:none; border:none; padding:0; color:var(--text-on-ink-muted);
    font:inherit; font-size:0.8rem; text-decoration:underline; cursor:pointer;
  }
  .link-btn:hover{ color:var(--brass); }
  .link-btn.danger{ color:#a15c3f; }
  .link-btn.danger:hover{ color:#c2704b; }
  .link-btn[hidden]{ display:none; }
  button:focus-visible, .nav-item:focus-visible, label:focus-within .stamp{
    outline:2px solid var(--verdigris); outline-offset:2px;
  }

  /* ---------- ledger ---------- */
  main{ flex:1; min-width:0; padding:34px 0 0; }
  .ledger{
    background:var(--parchment);
    color:var(--text);
    border-radius:var(--radius);
    box-shadow:0 1px 0 rgba(0,0,0,0.4), 0 12px 30px rgba(0,0,0,0.35);
    padding:2px 30px 10px;
  }

  section.building + section.building{ border-top:1px solid var(--parchment-edge); }

  .building-head{
    display:flex; align-items:center; gap:12px; width:100%;
    background:none; border:none; padding:20px 0 12px;
    font:inherit; color:inherit; text-align:left; cursor:pointer;
  }
  .building-head h2{ font-size:1.5rem; flex:1; }
  .building-head .count{
    font-size:0.78rem; color:var(--text-muted); font-variant-numeric:tabular-nums; flex-shrink:0;
  }
  .chev{ flex-shrink:0; color:var(--brass-deep); transition:transform .25s ease; }
  .building.collapsed .chev{ transform:rotate(-90deg); }

  .building-body{ display:grid; grid-template-rows:1fr; transition:grid-template-rows .3s ease; }
  .building.collapsed .building-body{ grid-template-rows:0fr; }
  .building-inner{
    overflow:hidden;
    /* This box has to clip for the collapse animation, so it reaches 10px
       wider than the rows and pads the content back into place - otherwise
       the focus ring around a stamp gets shaved off at the left edge. */
    margin:0 -10px; padding:0 10px;
  }
  .building-inner > .pad{ padding-bottom:14px; }

  .intro{ margin:0 0 4px; color:var(--text-muted); font-size:0.9rem; max-width:58ch; }

  .group{ margin-top:14px; }
  .group-label{
    font-size:0.72rem; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--text-muted); margin-bottom:2px;
  }
  .group.all-hidden{ display:none; }
  body.reveal .group.all-hidden{ display:block; }

  /* a wing with nothing available is gone from the page and from the nav */
  .building.all-hidden{ display:none; }
  body.reveal .building.all-hidden{ display:block; }
  .nav-item.all-hidden{ display:none; }
  body.reveal .nav-item.all-hidden{ display:flex; }
  .empty-note{ display:none; }
  body.reveal .building.all-hidden .empty-note{
    display:block; font-size:0.88rem; font-style:italic; color:var(--text-muted); padding:2px 0 6px;
  }

  /* ---------- rows ---------- */
  .row{ display:block; padding:10px 0; }
  .row-main{ display:flex; align-items:flex-start; gap:14px; cursor:pointer; }
  .row + .row{ border-top:1px solid rgba(58,46,28,0.12); }
  .row.hidden{ display:none; }
  body.reveal .row.hidden{ display:block; }
  .row.locked .row-main{ cursor:not-allowed; }
  body.reveal .row.locked{ opacity:0.5; cursor:not-allowed; }
  .row.locked.always{ opacity:0.5; cursor:not-allowed; }
  body.reveal .row.superseded{ opacity:0.55; }
  body.reveal .row.superseded .row-name{ text-decoration:line-through; text-decoration-color:rgba(58,46,28,0.4); }

  input.cb{ position:absolute; opacity:0; width:26px; height:26px; margin:0; cursor:pointer; }
  .stamp{
    position:relative; flex-shrink:0;
    width:24px; height:24px; margin-top:2px;
    border-radius:50%; border:2px solid var(--brass-deep);
    transition:background .2s ease, border-color .2s ease, transform .15s ease;
  }
  .row.locked .stamp{ border-color:rgba(58,46,28,0.35); border-style:dashed; }
  input.cb:checked + .stamp{ background:var(--brass); border-color:var(--brass-deep); border-style:solid; transform:scale(1.05); }
  .stamp svg{
    position:absolute; inset:0; margin:auto; width:14px; height:14px;
    opacity:0; transition:opacity .15s ease;
  }
  input.cb:checked + .stamp svg{ opacity:1; }

  .row-text{ flex:1; min-width:0; }
  .row-top{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
  .row-name{ font-weight:600; font-size:0.98rem; }
  .row-cost{ font-size:0.85rem; color:var(--text-muted); white-space:nowrap; flex-shrink:0; font-variant-numeric:tabular-nums; }
  .row-desc{ margin-top:2px; font-size:0.9rem; color:var(--text-muted); }

  /* ---------- constraint chips (next to the cost) ---------- */
  .chips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:7px; }
  .chips:empty{ display:none; }
  .chip{
    display:inline-flex; align-items:center; gap:5px;
    font-size:0.75rem; line-height:1.5; padding:2px 9px;
    border:1px solid rgba(58,46,28,0.22); border-radius:999px;
    color:var(--text-muted); background:rgba(255,255,255,0.25);
  }
  .chip.by{ border-color:rgba(93,124,108,0.45); color:#4a6657; }
  .chip.note{ border-color:rgba(93,124,108,0.45); color:#4a6657; }
  .chip.upgrade{ border-color:rgba(176,129,46,0.55); color:var(--brass-deep); }
  .chip.need{ display:none; }
  .chip.need.upgrade{ display:inline-flex; }
  .chip.need.unmet{ border-color:rgba(138,75,52,0.45); color:var(--rust); }
  .row.locked .chip.need{ display:inline-flex; }
  .chip.superseded[hidden]{ display:none; }
  .chip.superseded{ border-color:rgba(58,46,28,0.22); font-style:italic; }
  .row:not(.superseded) .chip.superseded{ display:none; }

  /* ---------- shared racks and the coin chest ---------- */
  .panel{ margin:10px 0 2px 38px; }
  .panel[hidden]{ display:none; }
  .panel-head{
    font-size:0.72rem; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--text-muted); margin-bottom:7px;
  }
  .slots{ display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:7px; }
  .slot{
    width:100%; font-family:inherit; font-size:0.88rem; color:var(--text);
    background:rgba(255,255,255,0.4); border:1px solid rgba(58,46,28,0.2);
    border-radius:5px; padding:8px 10px; min-height:38px;
  }
  .slot::placeholder{ color:var(--text-muted); opacity:0.55; }
  .slot:focus{ outline:2px solid var(--brass); outline-offset:1px; border-color:var(--brass); background:rgba(255,255,255,0.75); }
  .slot:not(:placeholder-shown){ background:rgba(255,255,255,0.7); }

  .coin{ display:flex; align-items:baseline; gap:9px; }
  .coin-num{
    font-family:'IM Fell English', Georgia, serif; font-size:1.9rem; line-height:1;
    color:var(--brass-deep); font-variant-numeric:tabular-nums;
  }
  .coin-label{ font-size:0.88rem; color:var(--text-muted); }
  .coin-actions{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .btn.small{ font-size:0.84rem; padding:8px 14px; min-height:38px; }

  /* ---------- the derived readouts ---------- */
  .sline{ display:flex; align-items:flex-start; gap:14px; padding:10px 0; }
  .sline + .sline{ border-top:1px solid rgba(58,46,28,0.12); }
  .sline.off{ display:none; }
  body.reveal .sline.off{ display:flex; opacity:0.5; }
  .sline-mark{ width:24px; flex-shrink:0; display:flex; justify-content:center; margin-top:7px; }
  .sline-mark::before{
    content:''; width:8px; height:8px; background:var(--brass); transform:rotate(45deg);
  }
  .sline.off .sline-mark::before{ background:none; border:1px solid rgba(58,46,28,0.4); }
  .sline-text{ flex:1; min-width:0; }
  .sline-top{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
  .sline-label{ font-weight:600; font-size:0.98rem; }
  .sline-src{ font-size:0.82rem; color:var(--text-muted); white-space:nowrap; flex-shrink:0; }
  .sline-desc{ display:block; margin-top:2px; font-size:0.9rem; color:var(--text-muted); }

  .wakeup-count{ display:flex; align-items:baseline; gap:12px; margin:10px 0 6px; }
  .wakeup-num{
    font-family:'IM Fell English', Georgia, serif; font-size:2.4rem; line-height:1;
    color:var(--brass-deep); min-width:1.2em; text-align:center;
  }
  .wakeup-label{ font-size:0.95rem; color:var(--text); }
  .wakeup-label small{ display:block; font-size:0.82rem; color:var(--text-muted); }
  .summary-empty{ margin:6px 0 2px; font-size:0.88rem; font-style:italic; color:var(--text-muted); }
  .summary-empty[hidden]{ display:none; }

  /* ---------- who built it ---------- */
  .credit{
    display:inline-flex; align-items:center; gap:6px;
    margin:6px 0 0 38px; padding:4px 8px 4px 6px; min-height:30px;
    background:none; border:1px dashed transparent; border-radius:5px;
    font:inherit; font-size:0.83rem; color:var(--brass-deep); cursor:pointer; text-align:left;
  }
  .credit:hover{ border-color:rgba(176,129,46,0.5); background:rgba(176,129,46,0.08); }
  .credit svg{ flex-shrink:0; opacity:0.8; }
  .credit .credit-text{ font-style:italic; }
  .credit.empty{ color:var(--text-muted); }
  .credit.empty .credit-text{ font-style:normal; opacity:0.75; }
  .credit[hidden]{ display:none; }

  dialog.namer{
    /* pinned to the viewport - without explicit insets a margin:0 dialog falls
       back to its static position and lands off-screen on a scrolled page */
    position:fixed; inset:0;
    width:100vw; max-width:100vw; height:100dvh; max-height:100dvh;
    margin:0; padding:0; border:none; background:transparent; overflow:hidden;
  }
  dialog.namer::backdrop{ background:rgba(18,12,6,0.7); }
  .sheet{
    width:min(430px, calc(100vw - 28px));
    margin:clamp(20px, 9vh, 110px) auto 0;
    background:var(--parchment); color:var(--text);
    border-radius:8px; padding:20px 20px 16px;
    box-shadow:0 18px 50px rgba(0,0,0,0.5);
  }
  .sheet h3{
    font-family:'IM Fell English', Georgia, serif; font-weight:400;
    font-size:1.3rem; margin:0;
  }
  .sheet .prompt{ margin:10px 0 10px; font-size:0.92rem; color:var(--text-muted); }
  .sheet input{
    width:100%; font-family:inherit; font-size:16px; /* 16px keeps iOS from zooming */
    color:var(--text); background:rgba(255,255,255,0.5);
    border:1px solid rgba(58,46,28,0.35); border-radius:5px; padding:11px 12px;
  }
  .sheet input::placeholder{ color:var(--text-muted); opacity:0.65; }
  .sheet input:focus{ outline:2px solid var(--brass); outline-offset:1px; border-color:var(--brass); }
  .namer-foot{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:14px; flex-wrap:wrap; }
  .counter{ font-size:0.78rem; color:var(--text-muted); font-variant-numeric:tabular-nums; }
  .counter.near{ color:var(--rust); }
  .namer-actions{ display:flex; gap:8px; margin-left:auto; }
  .btn{
    font:inherit; font-size:0.88rem; padding:9px 16px; min-height:40px;
    border-radius:5px; cursor:pointer; border:1px solid var(--brass-deep);
  }
  .btn.ghost{ background:none; color:var(--text-muted); border-color:rgba(58,46,28,0.3); }
  .btn.ghost:hover{ color:var(--text); border-color:rgba(58,46,28,0.55); }
  .btn.primary{ background:var(--brass); border-color:var(--brass-deep); color:#2a1f0c; font-weight:600; }
  .btn.primary:hover{ background:var(--brass-deep); color:var(--parchment); }

  @media (max-width:420px){
    .namer-actions{ width:100%; }
    .namer-actions .btn{ flex:1; }
  }

  /* ---------- "are you sure" toast ---------- */
  .toast{
    position:fixed; z-index:60; left:50%; bottom:28px; transform:translateX(-50%);
    width:min(620px, calc(100vw - 24px));
    background:var(--parchment); color:var(--text);
    border:1px solid var(--brass-deep); border-radius:10px;
    box-shadow:0 16px 44px rgba(0,0,0,0.5);
    padding:20px 24px 16px; font-size:1.05rem; line-height:1.45;
    animation:toast-in .18s ease-out;
  }
  .toast[hidden]{ display:none; }
  .toast .toast-text{ display:block; }
  .toast.spent .toast-text{ color:var(--text-muted); font-style:italic; font-size:0.95rem; }
  .toast-track{
    height:4px; margin-top:14px; border-radius:2px;
    background:rgba(58,46,28,0.15); overflow:hidden;
  }
  .toast-bar{
    display:block; height:100%; background:var(--brass);
    transform-origin:left center; animation:drain 1s linear forwards;
  }
  .toast.spent .toast-track{ opacity:0.35; }
  @keyframes drain{ from{ transform:scaleX(1); } to{ transform:scaleX(0); } }
  @keyframes toast-in{ from{ opacity:0; transform:translate(-50%, 10px); } to{ opacity:1; transform:translate(-50%, 0); } }
  @media (max-width:640px){
    .toast{ bottom:12px; padding:14px 16px 11px; font-size:0.95rem; border-radius:8px; }
    .toast-track{ margin-top:10px; }
  }

  .guildhall .row-name{ font-size:1.05rem; }

  .setup-banner{
    background:rgba(176,129,46,0.15); border:1px solid var(--brass);
    color:var(--text-on-ink); border-radius:var(--radius);
    padding:14px 16px; font-size:0.9rem; margin-bottom:18px;
  }
  .setup-banner code{ background:rgba(0,0,0,0.3); padding:1px 5px; border-radius:3px; font-size:0.85em; }

  /* ---------- narrow screens: nav becomes a top rail ---------- */
  @media (max-width:900px){
    /* stretch, not flex-start: as a column the base rule would size every
       child to its own content and push the page wider than the screen */
    .app{ flex-direction:column; align-items:stretch; gap:0; padding:0 14px 48px; }
    /* the sidebar's children join the page flow so only the nav rail stays sticky */
    .sidebar{ display:contents; }
    .sidebar h1{ order:1; font-size:1.3rem; padding-top:18px; }
    .sidebar .tagline{ display:none; }
    .sync{ order:2; margin-top:7px; }
    /* a thin rail, pinned to the top of the screen, scrolled sideways */
    .side-scroll{
      order:3; position:sticky; top:0; z-index:20;
      background:var(--ink); border-bottom:1px solid rgba(233,223,196,0.18);
      box-shadow:0 6px 12px -8px rgba(0,0,0,0.9);
      margin:10px -14px 0; padding:0 14px;
      overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
    }
    .side-scroll::-webkit-scrollbar{ display:none; }
    nav.side{ flex-direction:row; gap:2px; }
    .nav-item{
      width:auto; flex:0 0 auto; gap:6px; font-size:0.82rem; padding:6px 9px;
      border-left:none; border-bottom:2px solid transparent;
      border-radius:4px 4px 0 0; white-space:nowrap;
    }
    .nav-count{ font-size:0.7rem; }
    .nav-item.active{ border-left-color:transparent; border-bottom-color:var(--brass); }
    /* jumping to a section must clear the rail */
    section.building{ scroll-margin-top:46px; }
    main{ order:4; padding-top:14px; }
    .side-foot{
      order:5; flex-direction:row; align-items:center; flex-wrap:wrap; gap:16px;
      margin-top:20px; padding-top:14px;
    }
    .ledger{ padding:2px 14px 8px; }
  }

  @media (max-width:640px){
    /* the rack and the credit line reclaim the checkbox column */
    .panel{ margin-left:0; }
    .slots{ grid-template-columns:1fr; }
    .slot{ font-size:16px; }   /* 16px keeps iOS from zooming on focus */
    .credit{ margin-left:34px; }
    .sline-top{ flex-wrap:wrap; }
  }

  @media (max-width:380px){
    .app{ padding:0 10px 40px; }

<body>
  <div class="app">
    <aside class="sidebar">
      <h1>The Guildhall Ledger</h1>
      <p class="tagline">A shared record of what the guild has built.</p>
      <span class="sync" id="sync-status"><span class="sync-dot"></span><span class="sync-text">Connecting&hellip;</span></span>

      <div class="side-scroll">
        <nav class="side" id="nav"></nav>
      </div>

      <div class="side-foot">
        <span class="stat" id="progress-stat">&nbsp;</span>
        <label class="toggle">
          <input type="checkbox" id="reveal-toggle" />
          <span class="track"><span class="knob"></span></span>
          <span>Show locked &amp; replaced</span>
        </label>
        <button class="link-btn" id="collapse-btn" type="button">Collapse all</button>

        <div class="dm-row">
          <label class="toggle dm">
            <input type="checkbox" id="dm-toggle" />
            <span class="track"><span class="knob"></span></span>
            <span>DM mode</span>
          </label>
          <span class="dm-badge" id="dm-badge" hidden>Building as &ldquo;A Higher Hand&rdquo;</span>
          <button class="link-btn danger" id="destroy-btn" type="button" hidden>Destroy the Guild</button>
        </div>
      </div>
    </aside>

    <main>
      <div class="ledger" id="ledger"></div>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden>
    <span class="toast-text"></span>
    <span class="toast-track"><span class="toast-bar"></span></span>
  </div>

  <dialog class="namer" id="coin" aria-labelledby="coin-title">
    <form class="sheet" id="coin-form" method="dialog">
      <h3 id="coin-title">Deposit</h3>
      <label class="prompt" for="coin-input">How much gold?</label>
      <input id="coin-input" class="code" type="text" inputmode="numeric" autocomplete="off"
             maxlength="9" pattern="[0-9]*" enterkeyhint="done" />
      <div class="namer-foot">
        <span class="counter" id="coin-note"></span>
        <span class="namer-actions">
          <button type="button" class="btn ghost" id="coin-cancel">Cancel</button>
          <button type="submit" class="btn primary" id="coin-ok">Deposit</button>
        </span>
      </div>
    </form>
  </dialog>

  <dialog class="namer" id="dmgate" aria-labelledby="dmgate-title">
    <form class="sheet" id="dmgate-form" method="dialog">
      <h3 id="dmgate-title">DM mode</h3>
      <input id="dmgate-input" class="code" type="text" inputmode="numeric" autocomplete="off"
             maxlength="4" pattern="[0-9]*" enterkeyhint="go" aria-label="Code" />
      <span class="sr-only" id="dmgate-live" role="status" aria-live="polite"></span>
      <div class="namer-foot">
        <span class="namer-actions">
          <button type="button" class="btn ghost" id="dmgate-cancel">Cancel</button>
          <button type="submit" class="btn primary">Enter</button>
        </span>
      </div>
    </form>
  </dialog>

  <dialog class="namer" id="namer" aria-labelledby="namer-title">
    <form class="sheet" id="namer-form" method="dialog">
      <h3 id="namer-title"></h3>
      <label class="prompt" for="namer-input">What noble adventurer(s) have built this?</label>
      <input id="namer-input" type="text" maxlength="100" autocomplete="off" enterkeyhint="done" />
      <div class="namer-foot">
        <span class="counter" id="namer-count">0/100</span>
        <span class="namer-actions">
          <button type="button" class="btn ghost" id="namer-cancel">Cancel</button>
          <button type="submit" class="btn primary">Save</button>
        </span>
      </div>
    </form>
  </dialog>

    it._building = b.id;
    ITEM[it.id] = it;
    ALL_IDS.push(it.id);
    if(it.replaces){ (REPLACED_BY[it.replaces] = REPLACED_BY[it.replaces] || []).push(it.id); }
  })));

  const nameOf = id => (ITEM[id] ? ITEM[id].name : id);

  const SEAL_SVG = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
    + '<circle cx="12" cy="8" r="5"/><polyline points="8.5,12.5 7,22 12,19 17,22 15.5,12.5"/></svg>';

  const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="4,13 9,18 20,6"/></svg>';
  const CHEV_SVG = '<svg class="chev" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6,9 12,15 18,9"/></svg>';

  // Shown greyed out behind an empty field, as a hint of what belongs there.
  // Nothing is recorded unless someone actually types a name.
  const DEFAULT_BUILDERS = [
    'Joardyn Boombeard', 'Bandobras Broadleaf', 'Gretch the Ogre', "Cap'n Morgan",
    'Andrew Legelstein', 'Herbert the Miller', 'Lex, the Law'
  ];
  const randomBuilder = () => DEFAULT_BUILDERS[Math.floor(Math.random() * DEFAULT_BUILDERS.length)];

  // DM mode never touches the database: it lives in this browser only, so
  // switching it on here changes nothing for the rest of the party.
  const HIGHER_HAND = 'A Higher Hand';
  const DM_KEY = 'guildhall-dm';
  let dmMode = false;

  function todaysCode(){
    const d = new Date();
    return String(d.getDate()).padStart(2, '0') + String(d.getMonth() + 1).padStart(2, '0');
  }

  let state = {};      // id -> true, the checkmarks
  let builders = {};   // id -> who built it
  let rack = {};       // slot number -> what is on the rack
  let coin = 0;        // gold in the chest
  let pendingId = null;
  const openState = {};
  // (SECTIONS is built further down, so this runs over DATA and the two
  // readouts are added when the DOM is built.)

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  /* ---------- rules ---------- */
  const isBuilt = id => !!state[id];
  function needsMet(it){
    const all = (it.needs || []).every(isBuilt);
    const any = !it.needsAny || !it.needsAny.length || it.needsAny.some(isBuilt);
    return all && any;
  }
  function supersededBy(it){
    if(it.global) return null;
    const winners = (REPLACED_BY[it.id] || []).filter(isBuilt);
    return winners.length ? winners[winners.length - 1] : null;
  }

  /* ---------- render ---------- */
  function renderChips(it){
    let out = '';
    if(it.by) out += '<span class="chip by">Requires ' + escapeHtml(it.by) + '</span>';
    if(it.note) out += '<span class="chip note">' + escapeHtml(it.note) + '</span>';
    (it.needs || []).forEach(n => {
      const isUpgrade = n === it.replaces;
      out += '<span class="chip need' + (isUpgrade ? ' upgrade' : '') + '" data-need="' + escapeHtml(n) + '">'
        + (isUpgrade ? 'Upgrades ' : 'Needs ') + escapeHtml(nameOf(n)) + '</span>';
    });
    if(it.needsAny && it.needsAny.length){
      out += '<span class="chip need" data-need-any="' + escapeHtml(it.needsAny.join(',')) + '">Needs '
        + it.needsAny.map(id => escapeHtml(nameOf(id))).join(' or ') + '</span>';
    }
    out += '<span class="chip superseded" hidden></span>';
    return '<span class="chips">' + out + '</span>';
  }

  function renderRow(it){
    return '<div class="row' + (it.always ? ' always' : '') + '" data-id="' + it.id + '">'
      + '<label class="row-main">'
        + '<input class="cb" type="checkbox" data-id="' + it.id + '" />'
        + '<span class="stamp">' + CHECK_SVG + '</span>'
        + '<span class="row-text">'
          + '<span class="row-top">'
            + '<span class="row-name">' + escapeHtml(it.name) + '</span>'
            + (it.cost ? '<span class="row-cost">' + escapeHtml(it.cost) + '</span>' : '')
          + '</span>'
          + (it.desc ? '<span class="row-desc">' + escapeHtml(it.desc) + '</span>' : '')
          + renderChips(it)
        + '</span>'
      + '</label>'
      + '<button type="button" class="credit" data-edit="' + it.id + '" hidden>'
        + SEAL_SVG + '<span class="credit-text"></span>'
      + '</button>'
      + (it.panel ? renderPanel(it) : '')
      + '</div>';
  }

  // Both rows of a chain render their own copy; only the live one is shown,
  // and both are kept filled so an upgrade changes nothing on screen.
  function renderPanel(it){
    if(it.panel === 'armory'){
      let slots = '';
      for(let i = 1; i <= 10; i++){
        slots += '<input class="slot" type="text" maxlength="60" data-slot="' + i + '"'
          + ' placeholder="' + i + '" aria-label="Rack slot ' + i + '" />';
      }
      return '<div class="panel" data-panel="armory" hidden>'
        + '<div class="panel-head">On the racks</div>'
        + '<div class="slots">' + slots + '</div>'
        + '</div>';
    }
    return '<div class="panel" data-panel="chest" hidden>'
      + '<div class="coin"><span class="coin-num">0</span><span class="coin-label">gold in the chest</span></div>'
      + '<div class="coin-actions">'
        + '<button type="button" class="btn ghost small" data-coin="deposit">Deposit</button>'
        + '<button type="button" class="btn ghost small" data-coin="withdraw">Withdraw</button>'
      + '</div>'
      + '</div>';
  }

  function renderGroup(g){
    return '<div class="group' + (g.guildhall ? ' guildhall' : '') + '">'
      + (g.label ? '<div class="group-label">' + escapeHtml(g.label) + '</div>' : '')
      + g.items.map(renderRow).join('')
      + '</div>';
  }

  function renderBuilding(b){
    return '<section class="building" id="b-' + b.id + '">'
      + '<button class="building-head" type="button" aria-expanded="true" aria-controls="body-' + b.id + '" data-building="' + b.id + '">'
        + CHEV_SVG
        + '<h2>' + escapeHtml(b.title) + '</h2>'
        + '<span class="count" data-count="' + b.id + '"></span>'
      + '</button>'
      + '<div class="building-body" id="body-' + b.id + '"><div class="building-inner"><div class="pad">'
        + (b.intro ? '<p class="intro">' + escapeHtml(b.intro) + '</p>' : '')
        + '<p class="empty-note">' + (b.gate
            ? 'Raise the <strong>' + escapeHtml(nameOf(b.gate)) + '</strong> in The Phoenix Guild first.'
            : 'Nothing here is available yet &mdash; build its prerequisites first.') + '</p>'
        + b.groups.map(renderGroup).join('')
      + '</div></div></div>'
      + '</section>';
  }

  function renderSummary(sec){
    const lines = sec.entries.map((e, i) =>
      '<div class="sline off" data-sum="' + sec.id + '" data-entry="' + i + '">'
        + '<span class="sline-mark"></span>'
        + '<span class="sline-text">'
          + '<span class="sline-top">'
            + '<span class="sline-label">' + escapeHtml(e.label) + '</span>'
            + '<span class="sline-src"></span>'
          + '</span>'
          + '<span class="sline-desc"></span>'
        + '</span>'
      + '</div>').join('');

    const counter = sec.id === 'wakeup'
      ? '<div class="wakeup-count"><span class="wakeup-num" id="wakeup-num">0</span>'
        + '<span class="wakeup-label" id="wakeup-label"></span></div>'
      : '';

    return '<section class="building summary" id="b-' + sec.id + '">'
      + '<button class="building-head" type="button" aria-expanded="true" aria-controls="body-' + sec.id + '" data-building="' + sec.id + '">'
        + CHEV_SVG
        + '<h2>' + escapeHtml(sec.title) + '</h2>'
        + '<span class="count" data-count="' + sec.id + '"></span>'
      + '</button>'
      + '<div class="building-body" id="body-' + sec.id + '"><div class="building-inner"><div class="pad">'
        + '<p class="intro">' + escapeHtml(sec.intro) + '</p>'
        + counter
        + '<p class="summary-empty" data-empty="' + sec.id + '" hidden></p>'
        + lines
      + '</div></div></div>'
      + '</section>';
  }

  function renderNav(){
    return SECTIONS.map(b => '<button class="nav-item" type="button" data-target="' + b.id + '">'
      + '<span>' + escapeHtml(b.title) + '</span>'
      + '<span class="nav-count" data-navcount="' + b.id + '"></span>'
      + '</button>').join('');
  }

  function buildStaticDOM(){
    SECTIONS.forEach(sec => { if(openState[sec.id] === undefined) openState[sec.id] = true; });
    document.getElementById('ledger').innerHTML =
      SECTIONS.map(sec => sec.kind === 'summary' ? renderSummary(sec) : renderBuilding(sec)).join('');
    document.getElementById('nav').innerHTML = renderNav();
  }

  /* ---------- state -> UI ---------- */
  function applyState(){
    const counts = {};
    DATA.forEach(b => { counts[b.id] = { built:0, total:0 }; });

    document.querySelectorAll('.row').forEach(row => {
      const it = ITEM[row.dataset.id];
      if(!it) return;
      const built = isBuilt(it.id);
      const met = needsMet(it);
      const sup = supersededBy(it);
      const locked = !built && !met;

      row.classList.toggle('locked', locked);
      row.classList.toggle('superseded', !!sup);
      row.classList.toggle('hidden', (!!sup || locked) && !it.always);

      const cb = row.querySelector('.cb');
      if(pendingId !== it.id) cb.checked = built;   // don't fight the open dialog
      cb.disabled = locked && !dmMode;              // the DM may reach past the prerequisites

      const panel = row.querySelector('.panel');
      if(panel) panel.hidden = !built || !!sup;

      const credit = row.querySelector('.credit');
      const who = builders[it.id];
      credit.hidden = !built;
      credit.classList.toggle('empty', !who);
      credit.querySelector('.credit-text').textContent = who ? 'Built by ' + who : 'Name the builders';
      credit.setAttribute('aria-label', (who ? 'Built by ' + who + '. ' : '') + 'Edit who built ' + it.name);

      const supChip = row.querySelector('.chip.superseded');
      if(sup){ supChip.textContent = 'Replaced by ' + nameOf(sup); supChip.hidden = false; }
      else { supChip.textContent = ''; supChip.hidden = true; }

      row.querySelectorAll('.chip.need').forEach(chip => {
        let ok;
        if(chip.dataset.need) ok = isBuilt(chip.dataset.need);
        else ok = chip.dataset.needAny.split(',').some(isBuilt);
        chip.classList.toggle('unmet', !ok);
      });

      const c = counts[it._building];
      c.total++;
      if(built) c.built++;
    });

    document.querySelectorAll('.group').forEach(g => {
      g.classList.toggle('all-hidden', !g.querySelector('.row:not(.hidden)'));
    });

    DATA.forEach(b => {
      const sec = document.getElementById('b-' + b.id);
      const empty = !sec.querySelector('.row:not(.hidden)');
      sec.classList.toggle('all-hidden', empty);
      const c = counts[b.id];
      const label = c.built + '/' + c.total;
      sec.querySelector('[data-count="' + b.id + '"]').textContent = label;
      const nav = document.querySelector('[data-target="' + b.id + '"]');
      if(nav){
        nav.classList.toggle('all-hidden', empty);
        nav.querySelector('[data-navcount="' + b.id + '"]').textContent = label;
      }
    });

    applyPanels();
    applySummaries();

    const done = ALL_IDS.filter(isBuilt).length;
    document.getElementById('progress-stat').textContent = done + ' of ' + ALL_IDS.length + ' upgrades built';
  }

  // Contents live under one name per chain, so they carry across upgrades.
  function applyPanels(){
    document.querySelectorAll('.slot').forEach(el => {
      if(el === document.activeElement) return;   // never overwrite what someone is typing
      const v = rack['s' + el.dataset.slot] || '';
      if(el.value !== v) el.value = v;
    });
    document.querySelectorAll('.coin-num').forEach(el => { el.textContent = coin.toLocaleString(); });
  }

  // The readouts: for each entry show the best tier the guild has built.
  function applySummaries(){
    SUMMARY.forEach(sec => {
      let active = 0;
      sec.entries.forEach((e, i) => {
        const line = document.querySelector('.sline[data-sum="' + sec.id + '"][data-entry="' + i + '"]');
        const built = e.tiers.filter(t => isBuilt(t.id));
        const best = built.length ? built[built.length - 1] : null;
        const shown = best || e.tiers[0];   // locked entries preview their first tier
        line.classList.toggle('off', !best);
        line.querySelector('.sline-desc').textContent = shown.text;
        line.querySelector('.sline-src').textContent = best ? nameOf(best.id) : 'Needs ' + nameOf(shown.id);
        if(best) active++;
      });

      let wakeups = 0;
      if(sec.id === 'wakeup'){
        wakeups = isBuilt('mahogany-beds') ? 2 : isBuilt('stack-of-hay') ? 1 : 0;
        document.getElementById('wakeup-num').textContent = wakeups;
        document.getElementById('wakeup-label').innerHTML = wakeups === 1
          ? 'wakeup action each<small>after a long rest at the guild</small>'
          : 'wakeup actions each<small>' + (wakeups ? 'after a long rest at the guild' : 'the guild has nowhere to sleep yet') + '</small>';
      }

      const empty = document.querySelector('[data-empty="' + sec.id + '"]');
      empty.hidden = active > 0;
      empty.textContent = sec.id === 'wakeup'
        ? 'Nothing to spend them on yet.'
        : 'A long rest here is worth nothing yet.';

      const el = document.getElementById('b-' + sec.id);
      const hide = active === 0 && !(sec.id === 'wakeup' && wakeups > 0);
      el.classList.toggle('all-hidden', hide);
      el.querySelector('[data-count="' + sec.id + '"]').textContent = active;
      const nav = document.querySelector('[data-target="' + sec.id + '"]');
      if(nav){
        nav.classList.toggle('all-hidden', hide);
        nav.querySelector('[data-navcount="' + sec.id + '"]').textContent = active;
      }
    });
  }

  /* ---------- sync plumbing ---------- */
  function setSync(mode){
    const el = document.getElementById('sync-status');
    const text = el.querySelector('.sync-text');
    el.classList.toggle('error', mode === 'offline' || mode === 'error');
    if(mode === 'live') text.textContent = 'Live — synced with the party';
    else if(mode === 'offline') text.textContent = 'Reconnecting…';
    else if(mode === 'error') text.textContent = "Couldn't save — check the security rules";
    else if(mode === 'setup') text.textContent = 'Needs setup — see the note below';
    else text.textContent = 'Connecting…';
  }

  function showSetupBanner(){
    const banner = document.createElement('div');
    banner.className = 'setup-banner';
    banner.innerHTML = "This ledger needs a Firebase config before it can sync. Open the file, find <code>firebaseConfig</code> near the top of the script, and paste in your project's values.";
    document.querySelector('main').insertBefore(banner, document.getElementById('ledger'));
  }

  let db = null, checksRef = null;

  function initFirebase(){
    const app = initializeApp(firebaseConfig);
    db = getDatabase(app);
    checksRef = ref(db, 'guildhallLedger/checks');

    onValue(ref(db, '.info/connected'), snap => setSync(snap.val() === true ? 'live' : 'offline'));
    onValue(checksRef, snapshot => {
      state = snapshot.val() || {};
      applyState();
    }, () => setSync('error'));

    onValue(ref(db, 'guildhallLedger/builders'), snapshot => {
      builders = snapshot.val() || {};
      applyState();
    }, () => setSync('error'));

    onValue(ref(db, 'guildhallLedger/rack'), snapshot => {
      rack = snapshot.val() || {};
      applyPanels();
    }, () => setSync('error'));

    onValue(ref(db, 'guildhallLedger/chest'), snapshot => {
      const v = snapshot.val();
      coin = (v && typeof v.gold === 'number') ? v.gold : 0;
      applyPanels();
    }, () => setSync('error'));
  }

  // One update writes the checkmark and the builder together, so the party
  // never sees a built upgrade with a stale name on it.
  function writeItem(id, checked, name){
    if(!db) return;
    const payload = {};
    payload['checks/' + id] = checked ? true : null;
    payload['builders/' + id] = (checked && name) ? name : null;
    update(ref(db, 'guildhallLedger'), payload).catch(() => setSync('error'));
  }

  function writeSlot(n, text){
    if(!db) return;
    set(ref(db, 'guildhallLedger/rack/s' + n), text ? text.slice(0, 60) : null)
      .catch(() => setSync('error'));
  }

  // A transaction, because two heroes raiding the chest at once should not
  // be able to spend the same coins twice.
  function moveCoin(delta){
    if(!db) return;
    runTransaction(ref(db, 'guildhallLedger/chest'), current => {
      const have = (current && typeof current.gold === 'number') ? current.gold : 0;
      return { gold: Math.max(0, have + delta) };
    }).catch(() => setSync('error'));
  }

  // Only reachable from Destroy the Guild, behind DM mode and today's word.
  function resetAll(){
    if(!db) return;
    set(ref(db, 'guildhallLedger'), null).catch(() => setSync('error'));
  }

  /* ---------- interactions ---------- */
  function setOpen(id, open){
    openState[id] = open;
    const sec = document.getElementById('b-' + id);
    sec.classList.toggle('collapsed', !open);
    sec.querySelector('.building-head').setAttribute('aria-expanded', open ? 'true' : 'false');
  }

  /* ---------- "who built this?" ---------- */
  const namer = document.getElementById('namer');
  const namerForm = document.getElementById('namer-form');
  const namerInput = document.getElementById('namer-input');
  const namerCount = document.getElementById('namer-count');

  function updateCount(){
    const n = namerInput.value.length;
    namerCount.textContent = n + '/100';
    namerCount.classList.toggle('near', n >= 90);
  }

  function openNamer(id, mode){
    disarm();
    pendingId = id;
    namer.dataset.mode = mode;
    document.getElementById('namer-title').textContent = ITEM[id].name;
    namerInput.value = (builders[id] || '').slice(0, 100);
    namerInput.placeholder = randomBuilder();   // a different ghost name each time
    updateCount();
    if(typeof namer.showModal === 'function') namer.showModal();
    else namer.setAttribute('open', '');
    // a beat before focusing, so the dialog is painted and mobile keyboards behave
    setTimeout(() => { namerInput.focus(); namerInput.select(); }, 40);
  }

  function closeNamer(saved){
    const id = pendingId;
    const mode = namer.dataset.mode;
    pendingId = null;
    if(namer.open) namer.close(); else namer.removeAttribute('open');
    if(!saved && mode === 'check' && id){
      const cb = document.querySelector('.cb[data-id="' + id + '"]');
      if(cb) cb.checked = !!state[id];   // roll the tick back, nothing was written
    }
  }

  /* ---------- unticking takes two taps within a second ---------- */
  const toast = document.getElementById('toast');
  const toastText = toast.querySelector('.toast-text');
  let armedId = null;
  let armTimer = null;    // the 1s window in which a second click lands
  let toastTimer = null;  // the 5s the message stays readable

  function hideToast(){
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer = null;
    toast.hidden = true;
    toast.classList.remove('spent');
  }

  function disarm(){
    if(armTimer) clearTimeout(armTimer);
    armTimer = null; armedId = null;
    hideToast();
  }

  // A plain message, with no second-click window attached to it.
  function flashToast(msg, ms){
    if(armTimer) clearTimeout(armTimer);
    if(toastTimer) clearTimeout(toastTimer);
    armTimer = null; armedId = null;
    toast.classList.remove('spent');
    toastText.textContent = msg;
    toast.querySelector('.toast-track').hidden = true;
    toast.hidden = false;
    toastTimer = setTimeout(hideToast, ms || 4000);
  }

  function armUncheck(id){
    if(armTimer) clearTimeout(armTimer);
    if(toastTimer) clearTimeout(toastTimer);
    armedId = id;
    const who = builders[id] || 'the guild';

    toast.classList.remove('spent');
    toastText.textContent =
      'Click the upgrade again if you truly want to destroy the hard work of ' + who + '...';
    toast.hidden = false;
    toast.querySelector('.toast-track').hidden = false;
    const bar = toast.querySelector('.toast-bar');   // restart the one-second bar
    bar.style.animation = 'none';
    void bar.offsetWidth;
    bar.style.animation = '';

    // The second click only counts for a second. The message then says so
    // rather than sitting there inviting a click that no longer does anything.
    armTimer = setTimeout(() => {
      armTimer = null; armedId = null;
      toast.classList.add('spent');
      toastText.textContent = 'The moment passed \u2014 ' + who + "'s work still stands.";
    }, 1000);
    toastTimer = setTimeout(hideToast, 5000);
  }

  function setupNamer(){
    namerInput.addEventListener('input', updateCount);
    namerForm.addEventListener('submit', e => {
      e.preventDefault();
      const id = pendingId;
      if(!id) return;
      writeItem(id, true, namerInput.value.trim().slice(0, 100));
      closeNamer(true);
    });
    document.getElementById('namer-cancel').addEventListener('click', () => closeNamer(false));
    namer.addEventListener('cancel', e => { e.preventDefault(); closeNamer(false); });   // Escape
    namer.addEventListener('click', e => { if(e.target === namer) closeNamer(false); });  // tap outside
  }

  /* ---------- the DM's door ---------- */
  const dmToggle = document.getElementById('dm-toggle');
  const dmGate = document.getElementById('dmgate');
  const dmInput = document.getElementById('dmgate-input');
  const dmLive = document.getElementById('dmgate-live');
  const destroyBtn = document.getElementById('destroy-btn');
  let gateMode = 'unlock';

  function setDm(on){
    dmMode = on;
    dmToggle.checked = on;
    document.body.classList.toggle('dm', on);
    document.getElementById('dm-badge').hidden = !on;
    destroyBtn.hidden = !on;   // the guild can only be razed from inside DM mode
    try{
      if(on) localStorage.setItem(DM_KEY, todaysCode());
      else localStorage.removeItem(DM_KEY);
    }catch(e){ /* private windows and previews simply won't remember it */ }
    applyState();   // locked rows become clickable, or stop being so
  }

  function openGate(mode){
    gateMode = mode || 'unlock';
    document.getElementById('dmgate-title').textContent =
      gateMode === 'destroy' ? 'Destroy the Guild' : 'DM mode';
    dmInput.value = '';
    dmLive.textContent = '';
    if(typeof dmGate.showModal === 'function') dmGate.showModal();
    else dmGate.setAttribute('open', '');
    setTimeout(() => dmInput.focus(), 40);
  }

  function closeGate(){
    if(dmGate.open) dmGate.close(); else dmGate.removeAttribute('open');
    // the switch only sticks once the word is right
    if(gateMode === 'unlock' && !dmMode) dmToggle.checked = false;
  }

  function setupDmGate(){
    dmInput.addEventListener('input', () => {
      dmInput.value = dmInput.value.replace(/\D/g, '').slice(0, 4);
      dmLive.textContent = '';
    });

    document.getElementById('dmgate-form').addEventListener('submit', e => {
      e.preventDefault();
      if(dmInput.value === todaysCode()){
        if(gateMode === 'destroy'){
          const razed = ALL_IDS.filter(isBuilt).length;
          resetAll();
          closeGate();
          flashToast('The guild is ashes. ' + razed + ' upgrade' + (razed === 1 ? '' : 's') + ' undone.', 5000);
        } else {
          setDm(true);
          closeGate();
        }
      } else {
        // A shake and nothing else - the door gives no hints away.
        dmLive.textContent = 'Incorrect';
        const sheet = dmGate.querySelector('.sheet');
        sheet.classList.remove('shake');
        void sheet.offsetWidth;
        sheet.classList.add('shake');
        dmInput.select();
      }
    });

    destroyBtn.addEventListener('click', () => { if(dmMode) openGate('destroy'); });
    document.getElementById('dmgate-cancel').addEventListener('click', closeGate);
    dmGate.addEventListener('cancel', e => { e.preventDefault(); closeGate(); });
    dmGate.addEventListener('click', e => { if(e.target === dmGate) closeGate(); });

    dmToggle.addEventListener('change', () => {
      if(dmToggle.checked) openGate('unlock');
      else setDm(false);
    });

    // Remembered only for today - the word changes at midnight, and so does this.
    let remembered = null;
    try{ remembered = localStorage.getItem(DM_KEY); }catch(e){}
    if(remembered === todaysCode()) setDm(true);
  }

  /* ---------- the rack and the chest ---------- */
  const coinDialog = document.getElementById('coin');
  const coinInput = document.getElementById('coin-input');
  let coinMode = 'deposit';

  function openCoin(mode){
    coinMode = mode;
    const title = mode === 'deposit' ? 'Deposit' : 'Withdraw';
    document.getElementById('coin-title').textContent = title;
    document.getElementById('coin-ok').textContent = title;
    document.getElementById('coin-note').textContent = coin.toLocaleString() + 'g in the chest';
    coinInput.value = '';
    if(typeof coinDialog.showModal === 'function') coinDialog.showModal();
    else coinDialog.setAttribute('open', '');
    setTimeout(() => coinInput.focus(), 40);
  }

  function closeCoin(){
    if(coinDialog.open) coinDialog.close(); else coinDialog.removeAttribute('open');
  }

  function setupVault(){
    const timers = {};
    document.getElementById('ledger').addEventListener('input', e => {
      const slot = e.target.closest('.slot');
      if(!slot) return;
      const n = slot.dataset.slot;
      clearTimeout(timers[n]);   // settle for a moment before telling the party
      timers[n] = setTimeout(() => writeSlot(n, slot.value.trim()), 400);
    });
    document.getElementById('ledger').addEventListener('blur', e => {
      const slot = e.target.closest && e.target.closest('.slot');
      if(!slot) return;
      clearTimeout(timers[slot.dataset.slot]);
      writeSlot(slot.dataset.slot, slot.value.trim());
    }, true);

    coinInput.addEventListener('input', () => {
      coinInput.value = coinInput.value.replace(/\D/g, '').slice(0, 9);
    });
    document.getElementById('coin-form').addEventListener('submit', e => {
      e.preventDefault();
      const amount = parseInt(coinInput.value, 10);
      if(amount > 0) moveCoin(coinMode === 'deposit' ? amount : -amount);
      closeCoin();
    });
    document.getElementById('coin-cancel').addEventListener('click', closeCoin);
    coinDialog.addEventListener('cancel', e => { e.preventDefault(); closeCoin(); });
    coinDialog.addEventListener('click', e => { if(e.target === coinDialog) closeCoin(); });
  }

  function setupInteractions(){
    document.getElementById('ledger').addEventListener('click', e => {
      const coinBtn = e.target.closest('[data-coin]');
      if(coinBtn){ openCoin(coinBtn.dataset.coin); return; }
      const credit = e.target.closest('.credit');
      if(credit){ openNamer(credit.dataset.edit, 'edit'); return; }
      const head = e.target.closest('.building-head');
      if(!head) return;
      setOpen(head.dataset.building, !openState[head.dataset.building]);
      syncCollapseBtn();
    });

    document.getElementById('ledger').addEventListener('change', e => {
      const cb = e.target;
      if(!cb.classList || !cb.classList.contains('cb')) return;
      const id = cb.dataset.id;
      // Ticking asks who built it first; the write happens when that is answered.
      // In DM mode it just happens, signed by a higher hand.
      if(cb.checked){
        if(dmMode){ disarm(); writeItem(id, true, HIGHER_HAND); }
        else openNamer(id, 'check');
        return;
      }
      // The DM tears things down with one click; nobody's hard work is safe.
      if(dmMode){ disarm(); writeItem(id, false, null); return; }
      // For everyone else unticking is guarded: the first tap only arms it, a
      // second one within a second goes through and clears the name with it.
      if(armedId === id){
        disarm();
        writeItem(id, false, null);
      } else {
        cb.checked = true;
        armUncheck(id);
      }
    });

    document.getElementById('nav').addEventListener('click', e => {
      const btn = e.target.closest('.nav-item');
      if(!btn) return;
      const id = btn.dataset.target;
      setOpen(id, true);
      syncCollapseBtn();
      document.getElementById('b-' + id).scrollIntoView({ behavior:'smooth', block:'start' });
    });

    document.getElementById('reveal-toggle').addEventListener('change', e => {
      document.body.classList.toggle('reveal', e.target.checked);
    });

    document.getElementById('collapse-btn').addEventListener('click', () => {
      const anyOpen = SECTIONS.some(b => openState[b.id]);
      SECTIONS.forEach(b => setOpen(b.id, !anyOpen));
      syncCollapseBtn();
    });

  }

  function syncCollapseBtn(){
    const anyOpen = SECTIONS.some(b => openState[b.id]);
    document.getElementById('collapse-btn').textContent = anyOpen ? 'Collapse all' : 'Expand all';
  }

  function setupNavHighlight(){
    const buttons = Array.from(document.querySelectorAll('.nav-item'));
    const sections = SECTIONS.map(b => document.getElementById('b-' + b.id)).filter(Boolean);
    const io = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if(entry.isIntersecting){
          const id = entry.target.id.replace('b-', '');
          buttons.forEach(b => b.classList.toggle('active', b.dataset.target === id));
        }
      });
    }, { rootMargin:'-15% 0px -70% 0px' });
    sections.forEach(s => io.observe(s));
  }

  function init(){
    buildStaticDOM();
    setupNamer();
    setupVault();
    setupDmGate();
    setupInteractions();
    setupNavHighlight();
    syncCollapseBtn();
    applyState();

    if(NEEDS_SETUP){
      setSync('setup');
      showSetupBanner();
      return;
    }
    initFirebase();
  }

  init();

  // exposed so the gating rules can be checked without a database
  window.__ledger = {
    DATA, ITEM, needsMet, supersededBy,
    get state(){ return state; }, set state(v){ state = v; applyState(); },
    get builders(){ return builders; }, set builders(v){ builders = v; applyState(); },
    get dmMode(){ return dmMode; }, todaysCode,
    get rack(){ return rack; }, set rack(v){ rack = v; applyPanels(); },
    get coin(){ return coin; }, set coin(v){ coin = v; applyPanels(); }
  };
</script>
</body>
</html>
