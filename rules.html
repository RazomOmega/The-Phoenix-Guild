<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Altered Rules</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --ink:#221a10;
    --parchment:#efe4c6;
    --brass:#b0812e;
    --brass-deep:#8a651f;
    --verdigris:#5d7c6c;
    --rust:#8a4b34;
    --text:#3a2e1c;
    --text-muted:#7a6b4d;
    --text-on-ink:#e9dfc4;
    --text-on-ink-muted:#b6a985;
    --radius:6px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition-duration:0.001ms !important; animation-duration:0.001ms !important; }
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--ink);
    color:var(--text-on-ink);
    font-family:'Inter', -apple-system, sans-serif;
    line-height:1.5;
    min-height:100vh;
  }
  h1,h2{ font-family:'IM Fell English', Georgia, serif; font-weight:400; margin:0; }

  .app{
    display:flex; align-items:flex-start; gap:34px;
    max-width:1180px; margin:0 auto; padding:0 24px 72px;
  }

  /* ---------- left navigation ---------- */
  .sidebar{
    position:sticky; top:0; z-index:10;
    flex:0 0 246px; width:246px; height:100vh;
    display:flex; flex-direction:column;
    padding:34px 0 22px;
  }
  .sidebar h1{ font-size:1.45rem; line-height:1.2; }
  .sidebar .tagline{ margin:8px 0 0; font-size:0.83rem; color:var(--text-on-ink-muted); max-width:30ch; }

  .side-scroll{ flex:1; overflow-y:auto; margin-top:20px; padding-right:4px; }
  .side-scroll::-webkit-scrollbar{ width:6px; }
  .side-scroll::-webkit-scrollbar-thumb{ background:rgba(233,223,196,0.15); border-radius:3px; }

  nav.side{ display:flex; flex-direction:column; gap:1px; }
  .nav-item{
    display:flex; align-items:center; gap:10px;
    width:100%; background:none; border:none; border-left:2px solid transparent;
    color:var(--text-on-ink-muted); font:inherit; font-size:0.9rem;
    padding:8px 10px; border-radius:0 5px 5px 0; cursor:pointer; text-align:left;
  }
  .nav-item:hover{ color:var(--text-on-ink); background:rgba(233,223,196,0.06); }
  .nav-item.active{ color:var(--brass); border-left-color:var(--brass); background:rgba(176,129,46,0.12); }

  .side-foot{
    margin-top:16px; padding-top:14px; border-top:1px solid rgba(233,223,196,0.15);
    display:flex; flex-direction:column; gap:10px; align-items:flex-start;
  }
  .link-btn{
    background:none; border:none; padding:0; color:var(--text-on-ink-muted);
    font:inherit; font-size:0.8rem; text-decoration:underline; cursor:pointer;
  }
  .link-btn:hover{ color:var(--brass); }
  button:focus-visible, .nav-item:focus-visible, a:focus-visible{
    outline:2px solid var(--verdigris); outline-offset:2px;
  }

  /* ---------- the page itself ---------- */
  main{ flex:1; min-width:0; padding:34px 0 0; }
  .ledger{
    background:var(--parchment);
    color:var(--text);
    border-radius:var(--radius);
    box-shadow:0 1px 0 rgba(0,0,0,0.4), 0 12px 30px rgba(0,0,0,0.35);
    padding:2px 30px 10px;
  }

  section.rule{ border-top:1px solid rgba(58,46,28,0.26); }
  section.rule.first-visible{ border-top:none; }

  .rule-head{
    display:flex; align-items:center; gap:12px; width:100%;
    background:none; border:none; padding:22px 0 12px;
    font:inherit; color:inherit; text-align:left; cursor:pointer;
  }
  .rule-head h2{ font-size:1.5rem; flex:1; }
  .chev{ flex-shrink:0; color:var(--brass-deep); transition:transform .25s ease; }
  .rule.collapsed .chev{ transform:rotate(-90deg); }

  .rule-body{ display:grid; grid-template-rows:1fr; transition:grid-template-rows .3s ease; }
  .rule.collapsed .rule-body{ grid-template-rows:0fr; }
  .rule-inner{ overflow:hidden; margin:0 -10px; padding:0 10px; }
  .rule-inner > .pad{ padding-bottom:18px; }

  .rule p{ margin:0 0 10px; font-size:0.96rem; max-width:66ch; }
  .rule p:last-child{ margin-bottom:0; }
  .rule em{ font-style:italic; }

  /* a line that carries a single hard number */
  .figures{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr));
    gap:9px; margin:4px 0 14px;
  }
  .figure{
    border:1px solid rgba(58,46,28,0.18); border-radius:6px;
    background:rgba(255,255,255,0.3); padding:9px 12px 10px;
  }
  .figure-key{ font-size:0.68rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-muted); }
  .figure-val{
    font-family:'IM Fell English', Georgia, serif; font-size:1.7rem; line-height:1.1;
    color:var(--brass-deep); font-variant-numeric:tabular-nums; margin-top:1px;
  }
  .figure-val small{ font-family:'Inter', sans-serif; font-size:0.8rem; color:var(--text-muted); }

  .note{
    margin:12px 0 0; padding:12px 14px;
    border-left:3px solid var(--brass); background:rgba(176,129,46,0.1);
    border-radius:0 5px 5px 0; font-size:0.92rem;
  }
  .note.grim{ border-left-color:var(--rust); background:rgba(138,75,52,0.09); }
  .note strong{ font-weight:600; }

  .list{ margin:6px 0 0; padding:0; list-style:none; }
  .list li{
    display:flex; gap:11px; padding:9px 0; font-size:0.94rem;
    border-top:1px solid rgba(58,46,28,0.12);
  }
  .list li:first-child{ border-top:none; }
  .list .mark{ flex-shrink:0; width:8px; height:8px; margin-top:8px; background:var(--brass); transform:rotate(45deg); }
  .list .body{ flex:1; min-width:0; }

  table.xp{ width:100%; border-collapse:collapse; margin:6px 0 0; font-size:0.94rem; }
  table.xp th, table.xp td{
    text-align:left; padding:8px 10px 8px 0;
    border-bottom:1px solid rgba(58,46,28,0.12);
  }
  table.xp th{
    font-size:0.68rem; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--text-muted); font-weight:600;
  }
  table.xp td.n{ font-variant-numeric:tabular-nums; white-space:nowrap; }
  table.xp tr:last-child td{ border-bottom:none; }
  .table-wrap{ overflow-x:auto; }

  /* the first few steps are the ones anyone needs at the table; the long
     tail is there when someone wants to plan a campaign */
  table.xp tr.later{ display:none; }
  table.xp.open tr.later{ display:table-row; }
  .more-btn{
    display:inline-flex; align-items:center; gap:6px;
    margin-top:12px; padding:8px 14px; min-height:36px;
    font:inherit; font-size:0.86rem; color:var(--text);
    background:rgba(255,255,255,0.35); border:1px solid rgba(58,46,28,0.3);
    border-radius:5px; cursor:pointer;
  }
  .more-btn:hover{ border-color:var(--brass-deep); background:rgba(176,129,46,0.14); }
  .more-btn .chev{ transition:transform .25s ease; }
  .more-btn[aria-expanded="true"] .chev{ transform:rotate(180deg); }

  /* ---------- narrow screens ---------- */
  @media (max-width:900px){
    .app{ flex-direction:column; align-items:stretch; gap:0; padding:0 14px 78px; }
    .sidebar{ display:contents; }
    .sidebar h1{ order:1; font-size:1.3rem; padding-top:18px; }
    .sidebar .tagline{ display:none; }
    .side-scroll{
      order:3; position:sticky; top:0; z-index:20;
      background:var(--ink); border-bottom:1px solid rgba(233,223,196,0.18);
      box-shadow:0 6px 12px -8px rgba(0,0,0,0.9);
      margin:10px -14px 0; padding:0 14px;
      overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
    }
    .side-scroll::-webkit-scrollbar{ display:none; }
    nav.side{ flex-direction:row; gap:2px; }
    .nav-item{
      width:auto; flex:0 0 auto; font-size:0.82rem; padding:6px 9px;
      border-left:none; border-bottom:2px solid transparent;
      border-radius:4px 4px 0 0; white-space:nowrap;
    }
    .nav-item.active{ border-left-color:transparent; border-bottom-color:var(--brass); }
    section.rule{ scroll-margin-top:46px; }
    main{ order:4; padding-top:14px; }
    .side-foot{ order:5; margin-top:20px; padding-top:14px; }
    .ledger{ padding:2px 14px 8px; }

    /* Collapse all floats clear of the rail, as it does in the ledger */
    #collapse-btn{
      position:fixed; bottom:14px; right:12px; z-index:30;
      text-decoration:none; font-size:0.84rem; font-weight:600; line-height:1;
      padding:0 16px; min-height:38px; border-radius:999px;
      background:var(--parchment); color:var(--ink);
      border:1px solid var(--brass-deep);
      box-shadow:0 3px 14px rgba(0,0,0,0.6);
    }
    #collapse-btn:hover{ background:var(--brass); color:#2a1f0c; }
  }

  @media (max-width:640px){
    .figures{ grid-template-columns:1fr 1fr; }
    .rung{ width:40px; }
  }

  @media (max-width:380px){
    .app{ padding:0 10px 78px; }
    .side-scroll{ margin:10px -10px 0; padding:0 10px; }
    .ledger{ padding:2px 12px 8px; }
    .rule-head h2{ font-size:1.25rem; }
  }
</style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <h1>Altered Rules</h1>
      <p class="tagline">Where this table parts ways with the book.</p>

      <div class="side-scroll">
        <nav class="side" id="nav"></nav>
      </div>

      <div class="side-foot">
        <button class="link-btn" id="collapse-btn" type="button">Collapse all</button>
      </div>
    </aside>

    <main>
      <div class="ledger" id="rules"></div>
    </main>
  </div>

<script type="module">
  /* ==============================================================
     THE ALTERED RULES

     One entry per house rule. `body` is the HTML shown inside it -
     kept here rather than in the markup so the page is built the
     same way the ledger is, and a rule can be added in one place.
     ============================================================== */
  const CHEV_SVG = '<svg class="chev" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6,9 12,15 18,9"/></svg>';

  const RULES = [
    { id:'inspiration', title:'Inspiration', body:
      '<p>Each session, every player gets to give out <strong>1 Inspiration</strong> to another player for good roleplay.</p>'
    },

    { id:'death', title:'Death and Saves', body:
      '<div class="figures">'
        + '<div class="figure"><div class="figure-key">Death saves to die</div><div class="figure-val">6</div></div>'
        + '<div class="figure"><div class="figure-key">They reset</div><div class="figure-val">Never</div></div>'
        + '<div class="figure"><div class="figure-key">Resurrection</div><div class="figure-val">None</div></div>'
      + '</div>'
      + '<p>You can fail <strong>6 death saving throws</strong> before dying. Death saving throws never reset: they are permanent.</p>'
      + '<div class="note grim">Resurrection does not exist. <em>Nobody truly conquers death.</em></div>'
    },

    { id:'exhaustion', title:'Exhaustion and Heroic Actions', body:
      '<div class="figures">'
        + '<div class="figure"><div class="figure-key">Maximum exhaustion</div><div class="figure-val">9</div></div>'
        + '<div class="figure"><div class="figure-key">Each level</div><div class="figure-val">−1 <small>to d20 rolls</small></div></div>'
        + '<div class="figure"><div class="figure-key">Dropping to 0 HP</div><div class="figure-val">+1 <small>exhaustion</small></div></div>'
      + '</div>'
      + '<p>You can carry up to <strong>9 levels of Exhaustion</strong>. Each level subtracts 1 from your attack rolls, saving throws, and ability checks. Reaching 0 HP incurs 1 Exhaustion.</p>'
      + '<p>Whenever you would gain a <strong>10th level of exhaustion or beyond</strong>, you instead gain a failed Death save per level of exhaustion.</p>'
      + '<p><strong>Heroic Actions.</strong> Whenever you want, you may activate a Heroic Action <strong>once per turn</strong>. Doing this incurs a level of exhaustion, but grants you an extra action to use immediately.</p>'
    },

    { id:'potions', title:'Potions', body:
      '<p>Consuming a potion <em>yourself</em> takes a <strong>bonus action</strong> instead of a normal action.</p>'
    },

    { id:'resting', title:'Hit Dice and Resting', body:
      '<p>When short resting, you must <strong>consume a ration</strong> to spend a limited number of hit dice at a time. You can eat <strong>one ration per short rest</strong>.</p>'
    },

    { id:'experience', title:'Experience', body:
      '<p>You need an amount of experience equal to <strong>10 times your current level</strong> to advance to the next one. At level 2, that is 20 experience points to reach level 3.</p>'
      + '<div class="table-wrap"><table class="xp" id="xp-table"><thead><tr>'
        + '<th>Current level</th><th>XP to advance</th><th>Running total</th>'
      + '</tr></thead><tbody id="xp-rows"></tbody></table></div>'
      + '<button type="button" class="more-btn" id="xp-more" aria-expanded="false" aria-controls="xp-rows">'
        + 'Show every level' + CHEV_SVG
      + '</button>'
    },

    { id:'building', title:'Character Building', body:
      '<ul class="list">'
        + '<li><span class="mark"></span><span class="body">Use the <strong>Standard Array</strong> for ability scores.</span></li>'
        + '<li><span class="mark"></span><span class="body">You may select <strong>1 feat for free</strong> when creating a character. <em>Variant Humans can’t get 2.</em></span></li>'
        + '<li><span class="mark"></span><span class="body">You can cosmetically look like any species you want, as long as you mechanically function like a 5e species.</span></li>'
        + '<li><span class="mark"></span><span class="body">Whenever you gain an <strong>Ability Score Increase</strong> from levelling up, you may <em>also</em> select a feat in addition to that ASI.</span></li>'
      + '</ul>'
    }
  ];


  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  const openState = {};

  function renderRule(r){
    return '<section class="rule" id="r-' + r.id + '">'
      + '<button class="rule-head" type="button" aria-expanded="true" aria-controls="body-' + r.id + '" data-rule="' + r.id + '">'
        + CHEV_SVG
        + '<h2>' + escapeHtml(r.title) + '</h2>'
      + '</button>'
      + '<div class="rule-body" id="body-' + r.id + '"><div class="rule-inner"><div class="pad">'
        + r.body
      + '</div></div></div>'
      + '</section>';
  }

  function build(){
    RULES.forEach(r => { openState[r.id] = true; });
    document.getElementById('rules').innerHTML = RULES.map(renderRule).join('');
    document.getElementById('nav').innerHTML = RULES.map(r =>
      '<button class="nav-item" type="button" data-target="' + r.id + '">'
        + '<span>' + escapeHtml(r.title) + '</span>'
      + '</button>').join('');
    document.querySelector('section.rule').classList.add('first-visible');

    // What levelling actually costs. Everything past 3 → 4 is folded away
    // until someone asks for it.
    let total = 0;
    document.getElementById('xp-rows').innerHTML =
      Array.from({length: 19}, (_, i) => {
        const lvl = i + 1;
        total += lvl * 10;
        return '<tr' + (lvl > 3 ? ' class="later"' : '') + '>'
          + '<td class="n">' + lvl + ' → ' + (lvl + 1) + '</td>'
          + '<td class="n">' + (lvl * 10) + ' XP</td>'
          + '<td class="n">' + total + ' XP</td></tr>';
      }).join('');
  }

  function setOpen(id, open){
    openState[id] = open;
    const sec = document.getElementById('r-' + id);
    sec.classList.toggle('collapsed', !open);
    sec.querySelector('.rule-head').setAttribute('aria-expanded', open ? 'true' : 'false');
  }

  function syncCollapseBtn(){
    const anyOpen = RULES.some(r => openState[r.id]);
    document.getElementById('collapse-btn').textContent = anyOpen ? 'Collapse all' : 'Expand all';
  }

  function setup(){
    document.getElementById('rules').addEventListener('click', e => {
      const more = e.target.closest('#xp-more');
      if(more){
        const table = document.getElementById('xp-table');
        const open = !table.classList.contains('open');
        table.classList.toggle('open', open);
        more.setAttribute('aria-expanded', open ? 'true' : 'false');
        more.firstChild.textContent = open ? 'Show fewer levels' : 'Show every level';
        return;
      }
      const head = e.target.closest('.rule-head');
      if(!head) return;
      setOpen(head.dataset.rule, !openState[head.dataset.rule]);
      syncCollapseBtn();
    });

    document.getElementById('nav').addEventListener('click', e => {
      const btn = e.target.closest('.nav-item');
      if(!btn) return;
      setOpen(btn.dataset.target, true);
      syncCollapseBtn();
      document.getElementById('r-' + btn.dataset.target).scrollIntoView({ behavior:'smooth', block:'start' });
    });

    document.getElementById('collapse-btn').addEventListener('click', () => {
      const anyOpen = RULES.some(r => openState[r.id]);
      RULES.forEach(r => setOpen(r.id, !anyOpen));
      syncCollapseBtn();
    });

    const buttons = Array.from(document.querySelectorAll('.nav-item'));
    const io = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if(entry.isIntersecting){
          const id = entry.target.id.replace('r-', '');
          buttons.forEach(b => b.classList.toggle('active', b.dataset.target === id));
        }
      });
    }, { rootMargin:'-15% 0px -70% 0px' });
    RULES.forEach(r => io.observe(document.getElementById('r-' + r.id)));
  }

  build();
  setup();
  syncCollapseBtn();
</script>
</body>
</html>
